    limits:
    - 0.5
    - 1.5
    step: 0.01
    share: true
    active: true
scene.uncentre:
  title: Off-centre signer
  does: Moves the whole scene sideways and up or down, as if the signer stood elsewhere in the frame.
    The shift is limited so no hand point inside the frame leaves it.
  changes:
  - where the signer is in the frame
  keeps:
  - the pose, size and handshapes
  - every position relative to every other
  - the timing
  proven: ±0.1 of the frame (GISLR [M10])
  used: ±0.125 of the frame, hands kept in it
  extreme: false
  knobs:
