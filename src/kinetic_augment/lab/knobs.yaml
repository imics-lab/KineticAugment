temporal.time_warp.uniform:
  title: 'Speed: whole clip'
  does: Plays the whole clip faster or slower by one factor, interpolating the new frames (joint rotations
    by slerp).
  changes:
  - the clip’s length and the speed of every movement, uniformly
  keeps:
  - every pose the clip passes through, in the same order
  - 'the start and the end: nothing is cropped'
  - the body, handshapes and face of each frame
  proven: 0.67–1.5×; 0.5× hurt once [L6.2, M6, M3, T]
  used: 0.6–1.65×, log-uniform
  extreme: true
  knobs:
  - key: duration
    kind: range
    plain: How much faster or slower the whole clip is played, as a range of speed factors.
    technical: duration factor (duration)
    unit: ×
    proven: &id001
    - 0.67
    - 1.5
    limits: &id002
    - 0.4
    - 2.5
    step: 0.01
    share: true
    active: true
  - key: num_knots
    kind: scalar
    plain: How many points along the clip the speed is allowed to change at.
    technical: speed knots (num_knots)
    unit: knots
    proven: null
    limits: &id003
    - 2
    - 8
    step: 1
    share: false
    integer: true
    active: false
  - key: knot_rate
    kind: range
    plain: How much faster or slower the clip can get at each of those points, as a range of speed factors.
    technical: knot rate (knot_rate)
    unit: ×
    proven: null
    limits: &id004
    - 0.4
    - 2.5
    step: 0.01
    share: false
    active: false
  - key: protect_end
    kind: scalar
    plain: The share of the clip's end that is left at the plain overall speed.
    technical: protected end (protect_end)
    unit: fraction
    proven: null
    limits: &id005
    - 0
    - 0.5
    step: 0.01
    share: false
    active: false
  - key: segment_width
    kind: range
    plain: How much of the clip the slowed or sped-up window covers, as a range of shares.
    technical: segment width (segment_width)
    unit: fraction
    proven: null
    limits: &id006
    - 0.05
    - 1.0
    step: 0.01
    share: false
    active: false
  - key: segment_factor
    kind: range
    plain: How much faster or slower that window plays, as a range of speed factors.
    technical: segment factor (segment_factor)
    unit: ×
    proven: null
    limits: &id007
    - 0.4
    - 2.5
    step: 0.01
    share: false
    active: false
temporal.time_warp.varied:
  title: 'Speed: changing over the clip'
  does: 'Changes the speed smoothly over the clip: four speed knots of 0.7–1.43× each, on top of the uniform
    factor. The last 20% of the clip keeps the uniform speed.'
  changes:
  - the clip’s length, and which parts are fast or slow
  keeps:
  - every pose the clip passes through, in the same order
  - 'the start and the end: nothing is cropped'
  - the body, handshapes and face of each frame
  proven: 'none: non-uniform warps are excluded in the literature [L6.3, L6.4]'
  used: knot rates 0.7–1.43×, log-uniform
  note: 'An opt-in experiment arm: off in the default profile.'
  extreme: false
  knobs:
  - key: duration
    kind: range
    plain: How much faster or slower the whole clip is played, as a range of speed factors.
    technical: duration factor (duration)
    unit: ×
    proven: *id001
    limits: *id002
    step: 0.01
    share: false
    active: true
  - key: num_knots
    kind: scalar
    plain: How many points along the clip the speed is allowed to change at.
