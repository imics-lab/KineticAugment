scene.scale:
  title: Camera distance
  does: Scales the whole scene about the shoulder centre, as if the camera were nearer or farther.
  changes:
  - the overall size
  keeps:
  - 'the proportions: every position relative to every other'
  - the pose, handshapes and timing
  proven: 0.8–1.2 (GISLR [M10])
  used: 0.75–1.25
  extreme: true
  knobs:
  - key: factor
    kind: range
    plain: How much nearer or farther the camera seems, as a range of size factors.
    technical: scale factor (factor)
    unit: ×
    proven:
