scene.mirror:
  title: Mirror left and right
  does: 'Reflects the body left to right about the vertical plane through the shoulders and swaps the
    sides: hands, pose points, face points and the Left/Right blendshapes.'
  changes:
  - which hand does what
  - each handshape and the face become their mirror images
  keeps:
  - the shape and size of every movement (mirrored)
  - the timing
  proven: p = 0.5 [M6]; cost 1.3 pp on WLASL once [T]
  used: p = 0.5
  extreme: false
  knobs:
  - key: p
    kind: scalar
    plain: The chance that a clip is flipped left to right.
    technical: mirror probability (p)
    unit: 0–1
    proven:
    - 0
    - 0.5
    limits:
    - 0
    - 1
    step: 0.05
    share: true
    active: true
scene.view:
  title: Camera angle
  does: Turns the whole scene about the vertical axis through the shoulders (yaw) and tilts it (pitch),
    as if the camera stood elsewhere.
  changes:
  - the body’s orientation to the camera
  keeps:
  - 'the pose: every joint angle and bone length'
  - the handshapes and face
  - the timing
  proven: yaw ±20° (Spoken2Sign [M7]); pitch ±5° [T]
  used: yaw ±25°, pitch ±6°
  extreme: true
  knobs:
  - key: yaw_deg
    kind: scalar
    plain: How far the camera view is turned left or right.
    technical: yaw (yaw_deg)
    unit: ± °
    proven:
