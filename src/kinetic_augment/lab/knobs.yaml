    proven: null
    limits:
    - 0.005
    - 0.25
    step: 0.0025
    share: false
    active: true
  - key: cheeks_nose.enabled
    kind: bool
    plain: Whether the cheek and nose expression is changed at all.
    technical: cheek and nose switch (cheeks_nose.enabled)
    unit: ''
    proven: null
    limits: null
    step: null
    share: false
    active: true
  - key: cheeks_nose.sigma
    kind: scalar
    plain: How much the cheek and nose expression is changed, typically.
    technical: cheek and nose σ (cheeks_nose.sigma)
    unit: score
    proven: null
    limits:
    - 0
    - 0.075
    step: 0.0025
    share: false
    active: true
  - key: cheeks_nose.truncate
    kind: scalar
    plain: The most the cheek and nose expression can ever be changed.
    technical: cheek and nose truncation (cheeks_nose.truncate)
    unit: score
    proven: null
    limits:
    - 0.005
    - 0.15
    step: 0.0025
    share: false
    active: true
  - key: mouth_jaw.enabled
    kind: bool
    plain: Whether the mouth and jaw expression is changed at all.
    technical: mouth and jaw switch (mouth_jaw.enabled)
