temporal.hand_dropout:
  title: Hand goes missing
  does: Removes a hand for short runs of frames, as when MediaPipe loses it mid-sign. Runs start with
    a set chance per frame, last 1.9 frames on average and at most 10.
  changes:
  - 'the hand in the dropped frames: missing (NaN) and marked invalid'
  keeps:
  - the body, face and the other hand
  - every other frame
  - the timing
  proven: runs ≤ 8 frames [M4, M10]; the start rate has no literature value, measured 0.039 here
  used: runs of 1–10 frames, start rate 0–0.05 per frame
  extreme: false
  knobs:
  - key: start_rate
    kind: range
    plain: How likely a hand is to go missing at any frame, as a range of chances per frame.
    technical: start rate (start_rate)
    unit: per frame
    proven: null
    limits:
