temporal.frame_drop.rate:
  title: 'Dropped frames: lower frame rate'
  does: 'Drops frames down to a lower frame rate: keeps the frames nearest a 12–25 fps grid, never below
    8 fps, and never opens a gap over 125 ms.'
  changes:
  - the number of frames and the gaps between them
  keeps:
  - every kept frame exactly as it was
  - the first and last frames
  proven: ≥ 10 fps, where intelligibility stops improving [T]; masked runs ≤ 8 frames [M4, M10]
  used: 12–25 fps, never below 8 fps, gaps ≤ 125 ms
  note: The kept frames keep their timestamps; played back to back at the clip’s frame rate, the clip
    looks faster.
  extreme: true
  knobs:
  - key: target_fps
    kind: range
    plain: The lower frame rate the clip is thinned down to, as a range of frames per second.
    technical: target rate (target_fps)
    unit: fps
    proven: &id008
    - 10
    - 30
    limits: &id009
    - 8
    - 50
    step: 1
    share: true
    active: true
  - key: min_fps
    kind: scalar
    plain: The lowest frame rate the clip may ever be thinned to.
    technical: minimum rate (min_fps)
