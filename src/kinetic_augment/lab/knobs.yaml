    plain: How much the brow expression is changed, typically.
    technical: brow σ (brows.sigma)
    unit: score
    proven: null
    limits:
    - 0
    - 0.125
    step: 0.0025
    share: true
    active: true
  - key: brows.truncate
    kind: scalar
    plain: The most the brow expression can ever be changed.
    technical: brow truncation (brows.truncate)
    unit: score
    proven: null
    limits:
    - 0.005
    - 0.25
    step: 0.0025
    share: false
    active: true
  - key: eyes.enabled
