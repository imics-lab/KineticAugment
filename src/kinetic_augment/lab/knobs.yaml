# The Augmentation Lab's plain-English knob text: one entry per lab augmentation, each with its
# explanation (does/changes/keeps/proven/used/note, from the week-4 demo) and one knob per range key of
# the augmentation. `plain` is read first by the UI; `technical` is the symbol and YAML key.
# `proven` is the literature range (null = none); `limits` bound the slider; `active: false` marks a
# knob the run's mode does not use; `share: true` knobs get stops in share mode.
body.joint_coupled_noise:
  title: Arm angle noise
  does: 'Turns the shoulder, elbow and wrist of both arms by one draw for the whole clip. The draws are
    coupled: shoulder and wrist share part of a common draw, and the two arms are correlated (mirrored),
    so the arms change together the way one signer’s would.'
  changes:
  - the arm posture, so each hand moves a few centimetres and turns with the wrist
  keeps:
  - the finger poses (handshape)
  - the torso, head and face
  - the bone lengths
  - the timing
  proven: ±4° shoulder/wrist at p = 0.3 (SPOTER [M1]); ±7.5° elbow [T]
  used: shoulder/wrist σ 2.5°, ≤ 5°; elbow σ 4.75°, ≤ 9.5°
  extreme: true
  knobs:
  - key: sigma_deg
    kind: scalar
    plain: How far the shoulders and wrists are turned, typically.
    technical: shoulder/wrist σ (sigma_deg)
    unit: °
    proven:
    - 0
    - 4
    limits:
    - 0
    - 10
    step: 0.25
    share: true
    active: true
  - key: truncate_deg
    kind: scalar
    plain: The most the shoulders and wrists can ever be turned.
    technical: shoulder/wrist truncation (truncate_deg)
    unit: °
    proven:
    - 0
    - 4
    limits:
    - 0
    - 10
    step: 0.25
    share: false
    active: true
  - key: elbow_sigma_deg
    kind: scalar
    plain: How far the elbows are bent or straightened, typically.
    technical: elbow σ (elbow_sigma_deg)
    unit: °
    proven:
    - 0
    - 7.5
    limits:
    - 0
    - 15
    step: 0.25
    share: true
    active: true
  - key: elbow_truncate_deg
    kind: scalar
    plain: The most an elbow can ever be bent or straightened.
    technical: elbow truncation (elbow_truncate_deg)
    unit: °
    proven:
    - 0
    - 7.5
    limits:
    - 0
    - 15
    step: 0.25
    share: false
    active: true
  - key: chain_coupling
    kind: scalar
    plain: How much the shoulder and wrist of one arm move together (0 = independently, 1 = identically).
    technical: chain coupling (chain_coupling)
    unit: 0–1
    proven: null
    limits:
    - 0
    - 1
    step: 0.05
    share: false
    active: true
  - key: side_coupling
    kind: scalar
    plain: How much the left and right arms change alike (0 = independently, 1 = identically).
    technical: side coupling (side_coupling)
    unit: 0–1
    proven: null
    limits:
    - 0
    - 1
    step: 0.05
    share: false
    active: true
  - key: side_mode
    kind: enum
    plain: 'How the two arms relate: mirrored, drawn separately, or moving the same way.'
    technical: side mode (side_mode)
    unit: ''
    proven: null
    limits: null
    step: null
    share: false
    options:
    - mirror
    - independent
    - synchronous
    multi: false
    active: true
  - key: drift_deg
    kind: scalar
    plain: A slow wander of the arm angles over the clip (0 = none).
    technical: drift (drift_deg)
    unit: °
    proven: null
    limits:
    - 0
    - 5
    step: 0.25
    share: false
    active: true
body.limb_length_scaling:
  title: Arm bone lengths
  does: Lengthens or shortens the upper arm and forearm, as for a signer with other proportions, then
    re-solves each arm with two-bone IK so the wrist stays where it was.
  changes:
  - the arm bone lengths and where the elbows are
  keeps:
  - the handshapes and face
  - the timing
  proven: no literature range; the between-signer spread in this project’s data is 5.7% (Grounding §6.1)
  used: 0.93–1.07
  note: 'An opt-in experiment arm: off in the default profile.'
  extreme: true
  knobs:
  - key: factor
    kind: range
    plain: How much longer or shorter the arm bones are made, as a range of scale factors.
    technical: length factor (factor)
    unit: ×
    proven: null
    limits:
    - 0.8
    - 1.2
    step: 0.01
    share: true
    active: true
  - key: bones
    kind: enum
    plain: Which arm bones are resized.
    technical: bones (bones)
    unit: ''
    proven: null
    limits: null
    step: null
    share: false
    options:
    - upper_arm
    - forearm
    - hand
    multi: true
    active: true
  - key: retarget
    kind: bool
    plain: Re-bend the arm so each wrist stays exactly where it was.
    technical: retarget (retarget)
    unit: ''
    proven: null
    limits: null
    step: null
    share: false
    active: true
body.movement_size:
  title: Movement size
  does: 'Makes every movement bigger or smaller: each wrist’s path is scaled about its own centre, and
    the arm is re-solved to follow it.'
  changes:
  - how far the hands travel
  keeps:
  - where the movement happens (its centre)
  - the handshapes and face
  - the timing
  proven: no measured range; 0.85–1.15 is Grounding’s linguistic example [L2.10, L2.11]
  used: 0.8–1.2, log-uniform
  extreme: true
  knobs:
  - key: factor
    kind: range
    plain: How much bigger or smaller every movement is made, as a range of scale factors.
    technical: size factor (factor)
    unit: ×
    proven: null
    limits:
    - 0.6
    - 1.4
    step: 0.01
    share: true
    active: true
body.location_jitter:
  title: Signing-space shift
  does: Moves where the signing happens by one 3-D offset for the whole clip, in the torso frame, and
    re-solves the arms so the hands follow.
  changes:
  - where the hands are relative to the body, by up to 25 mm
  keeps:
  - the shape and size of every movement
  - the handshapes and face
  - the timing
  proven: σ = 10 mm, ≤ 20 mm (production spread [T])
  used: σ = 12.5 mm, ≤ 25 mm
  extreme: true
  knobs:
  - key: sigma_mm
    kind: scalar
    plain: How far the signing space is moved, typically.
    technical: offset σ (sigma_mm)
    unit: mm
    proven:
    - 0
    - 10
    limits:
    - 0
    - 25
    step: 0.5
    share: true
    active: true
  - key: truncate_mm
    kind: scalar
    plain: The farthest the signing space can ever be moved.
    technical: offset truncation (truncate_mm)
    unit: mm
    proven:
    - 1
    - 20
    limits:
    - 1
    - 50
    step: 0.5
    share: false
    active: true
fingers.joint_coupled_noise:
  title: Finger bend noise
  does: Bends or straightens each finger a little, the same for the whole clip. The knuckle (MCP) and
    middle joint (PIP) get one draw each, neighbouring fingers are correlated, and the end joint (DIP)
    follows the PIP.
  changes:
  - the finger bends, by a few degrees
  keeps:
  - the arms, wrists and face
  - the timing
  proven: no published range
  used: σ 3.75°, ≤ 7.5° (an estimate of 3° / 6°, widened)
  note: 'The change is a few degrees per joint: use the hand views to see it.'
  extreme: true
  knobs:
  - key: sigma_deg
    kind: scalar
    plain: How much each finger joint is bent or straightened, typically.
    technical: joint σ (sigma_deg)
    unit: °
    proven: null
    limits:
    - 0
    - 8
    step: 0.25
    share: true
    active: true
  - key: truncate_deg
    kind: scalar
    plain: The most any finger joint can ever change.
    technical: joint truncation (truncate_deg)
    unit: °
    proven: null
    limits:
    - 0
    - 15
    step: 0.25
    share: false
    active: true
  - key: finger_coupling
    kind: scalar
    plain: How much neighbouring fingers bend alike (0 = independently, 1 = identically).
    technical: finger coupling (finger_coupling)
    unit: 0–1
    proven: null
    limits:
    - 0
    - 1
    step: 0.05
    share: false
    active: true
  - key: dip_ratio
    kind: scalar
    plain: How much the fingertip joint follows the middle joint's change.
    technical: DIP-to-PIP ratio (dip_ratio)
    unit: ''
    proven: null
    limits:
    - 0
    - 1
    step: 0.01
    share: false
    active: true
fingers.handshape_jitter:
  title: Handshape-safe finger jitter
  does: 'Jitters every finger joint while keeping the handshape class: which fingers are selected, open
    or closed, their spread and the thumb. A draw that would change the class is drawn again; after 5
    tries the clip is left unchanged.'
  changes:
  - the joints of the non-selected fingers and the thumb most (σ 7.5°), the selected fingers less
  keeps:
  - the handshape class
  - the arms, wrists and face
  - the timing
  proven: no published range; GISLR’s “finger-tree rotate” gives no angle [T]
  used: non-selected and thumb σ 7.5°, selected σ 3.75°, selected flexion σ 2°, all ≤ 2σ
  extreme: false
  knobs:
  - key: nonselected_sigma_deg
    kind: scalar
    plain: How much the fingers that do not define the handshape, and the thumb, are jittered.
    technical: non-selected σ (nonselected_sigma_deg)
    unit: °
    proven: null
    limits:
    - 0
    - 15
    step: 0.25
    share: true
    active: true
  - key: selected_sigma_deg
    kind: scalar
    plain: How much the fingers that define the handshape are jittered.
    technical: selected σ (selected_sigma_deg)
    unit: °
    proven: null
    limits:
    - 0
    - 8
    step: 0.25
    share: true
    active: true
  - key: selected_flexion_sigma_deg
    kind: scalar
    plain: How much the defining fingers' bend is jittered.
    technical: selected flexion σ (selected_flexion_sigma_deg)
    unit: °
    proven: null
    limits:
    - 0
    - 4
    step: 0.25
    share: false
    active: true
  - key: truncate_sigmas
    kind: scalar
    plain: How many typical steps (σ) from the original a joint may move at most.
    technical: truncation (truncate_sigmas)
    unit: σ
    proven: null
    limits:
    - 0.5
    - 4
    step: 0.1
    share: false
    active: true
  - key: max_redraws
    kind: scalar
    plain: How many times a draw that would change the handshape is retried before leaving the clip alone.
    technical: max redraws (max_redraws)
    unit: tries
    proven: null
    limits:
    - 0
    - 10
    step: 1
    share: false
    integer: true
    active: true
  - key: feature_margin_deg
    kind: scalar
    plain: How far from the handshape's decision thresholds the fingers must stay.
    technical: feature margin (feature_margin_deg)
    unit: °
    proven: null
    limits:
    - 0
    - 10
    step: 0.5
    share: false
    active: true
face.expression_jitter:
  title: Facial expression jitter
  does: 'Shifts the facial expression a little for the whole clip: the brow, eye and cheek/nose blendshapes
    get one offset each, and the face points move by a linear map from blendshapes to points fitted on
    the clip. Mouth and jaw stay as they are, since mouth patterns can change the sign.'
  changes:
  - the brows, eyelids and cheeks, by a few millimetres
  - the blendshape scores
  keeps:
  - the mouth and jaw
  - the head pose and the rigid face points
  - the body, hands and timing
  proven: no published range; lexical mouth patterns excluded [L7.3, L1.5]
  used: brows and eyes σ 0.0625, ≤ 0.125; cheeks/nose σ 0.0375, ≤ 0.075; mouth/jaw off
  note: 'The change is a few millimetres: use the face view to see it.'
  extreme: true
  knobs:
  - key: brows.enabled
    kind: bool
    plain: Whether the brow expression is changed at all.
    technical: brow switch (brows.enabled)
    unit: ''
    proven: null
    limits: null
    step: null
    share: false
    active: true
  - key: brows.sigma
