    unit: knots
    proven: null
    limits: *id003
    step: 1
    share: false
    integer: true
    active: true
  - key: knot_rate
    kind: range
    plain: How much faster or slower the clip can get at each of those points, as a range of speed factors.
    technical: knot rate (knot_rate)
    unit: ×
    proven: null
    limits: *id004
    step: 0.01
    share: true
    active: true
  - key: protect_end
    kind: scalar
    plain: The share of the clip's end that is left at the plain overall speed.
