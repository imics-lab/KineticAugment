# KineticAugment pipeline config for Sign Language Recognition (SLR).
# Format: kinetic_augment.Pipeline.from_yaml(). Generated from the 'moderate' preset.
# PoseFlipping is deliberately absent: mirroring swaps the signing hand and can change
# sign meaning. (The legacy-format profile lives in configs/legacy/slr_profile.yaml.)
profile_name: slr_default
mode: landmark
plan:
- operation: GlobalRotation
  probability: 0.6
  params:
    max_angle_deg:
      x: 10
      y: 15
      z: 5
- operation: GlobalScaling
  probability: 0.4
  params:
    scale_range:
    - 0.9
    - 1.1
- operation: TrajectoryJittering
  probability: 0.3
  params:
    amplitude: 0.01
    frequency: 0.3
- operation: TimeWarping
  probability: 0.4
  params:
    max_warp_factor: 0.15
- operation: GaussianNoise
  probability: 0.5
  params:
    stddev: 0.005
    landmark_groups:
    - pose
    - left_hand
    - right_hand
constraints:
  joint_limits: true
  velocity_limits: true
  collision_detection: false
  strict_mode: false
  use_sign_language_limits: true
frame_rate: 30.0
description: 'Sign Language Recognition: moderate augmentation, no left/right flipping'
